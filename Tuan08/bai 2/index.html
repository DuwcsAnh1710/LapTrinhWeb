<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuan 8 - Bai 2</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        padding: 32px;
        background: #f6f8fb;
        color: #1f2f3d;
      }

      h1 {
        text-align: center;
        margin-bottom: 28px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #1a4d7a;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
        border-radius: 8px;
        overflow: hidden;
      }

      th,
      td {
        border: 1px solid #d5deeb;
        text-align: center;
        padding: 14px 10px;
        font-size: 14px;
      }

      th {
        background: #eaf1fb;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      td:first-child,
      th:first-child {
        width: 50px;
      }

      td:nth-child(2) {
        width: 180px;
      }

      td:nth-child(3) {
        width: 120px;
      }

      td:nth-child(4) {
        width: 160px;
      }

      .flower-img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #d5deeb;
        background: #f9fbff;
      }

      input[type="number"] {
        width: 100%;
        max-width: 110px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #c3d2e4;
        font-size: 14px;
        text-align: center;
        box-sizing: border-box;
      }

      input[type="number"]:focus {
        outline: none;
        border-color: #1e88e5;
        box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.2);
      }

      tfoot td {
        font-weight: 700;
        font-size: 16px;
        text-transform: uppercase;
        background: #f1f5fb;
      }

      .total-amount {
        font-size: 18px;
        color: #0c6a3d;
      }

      .controls {
        margin-top: 18px;
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      button {
        padding: 12px 18px;
        border-radius: 6px;
        border: none;
        font-weight: 600;
        letter-spacing: 0.05em;
        cursor: pointer;
        text-transform: uppercase;
        background: #1e88e5;
        color: #ffffff;
        transition: opacity 0.2s ease, transform 0.1s ease;
      }

      button:hover {
        opacity: 0.85;
      }

      button:active {
        transform: translateY(1px);
      }

      .btn-reset {
        background: #f5f7fa;
        color: #1f2f3d;
        border: 1px solid #c3d2e4;
      }

      .note {
        margin-top: 12px;
        font-size: 13px;
        color: #5a6a7a;
      }
    </style>
  </head>
  <body>
    <h1>Form xU ly du lieu</h1>
    <div class="table-wrapper">
      <table aria-describedby="tableNote">
        <thead>
          <tr>
            <th>STT</th>
            <th>Hinh anh</th>
            <th>Gia (VND)</th>
            <th>So luong</th>
          </tr>
        </thead>
        <tbody id="flowerTableBody">
          <tr data-price="20000">
            <td>1</td>
            <td>
              <img
                class="flower-img"
                src="flowers/flower1.jpg"
                alt="Bo hoa hong pastel"
              />
            </td>
            <td>20,000</td>
            <td>
              <input type="number" class="quantity-input" min="0" value="20" />
            </td>
          </tr>
          <tr data-price="40000">
            <td>2</td>
            <td>
              <img
                class="flower-img"
                src="flowers/flower2.jpg"
                alt="Bo hoa hong tim"
              />
            </td>
            <td>40,000</td>
            <td>
              <input type="number" class="quantity-input" min="0" value="5" />
            </td>
          </tr>
          <tr data-price="30000">
            <td>3</td>
            <td>
              <img
                class="flower-img"
                src="flowers/flower3.jpg"
                alt="Bo hoa hong hong"
              />
            </td>
            <td>30,000</td>
            <td>
              <input type="number" class="quantity-input" min="0" value="0" />
            </td>
          </tr>
          <tr data-price="50000">
            <td>4</td>
            <td>
              <img
                class="flower-img"
                src="flowers/flower4.jpg"
                alt="Bo hoa tha thu"
              />
            </td>
            <td>50,000</td>
            <td>
              <input type="number" class="quantity-input" min="0" value="0" />
            </td>
          </tr>
          <tr data-price="30000">
            <td>5</td>
            <td>
              <img
                class="flower-img"
                src="flowers/flower5.jpg"
                alt="Bo hoa hong trang"
              />
            </td>
            <td>30,000</td>
            <td>
              <input type="number" class="quantity-input" min="0" value="0" />
            </td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3">Tong thanh tien</td>
            <td class="total-amount" id="totalAmount">600,000</td>
          </tr>
        </tfoot>
      </table>
      <p id="tableNote" class="note">
        Thay the hinh anh bang file thuc te trong thu muc <code>flowers/</code>
        neu can.
      </p>
    </div>

    <div class="controls">
      <button id="calculateBtn" type="button">Tinh tong</button>
      <button id="resetBtn" type="button" class="btn-reset">Dat lai</button>
    </div>

    <script>
      $(function () {
        const formatCurrency = (value) =>
          Number(value).toLocaleString("vi-VN");

        const calculateTotal = () => {
          let total = 0;
          $("#flowerTableBody tr").each(function () {
            const price = Number($(this).data("price"));
            const quantity = Number(
              $(this).find(".quantity-input").val() || 0
            );
            total += price * quantity;
          });
          $("#totalAmount").text(formatCurrency(total));
          return total;
        };

        // Calculate initial total
        calculateTotal();

        $(".quantity-input").on("input", function () {
          const value = $(this).val();
          if (value === "" || Number(value) < 0) {
            $(this).val(0);
          }
          calculateTotal();
        });

        $("#calculateBtn").on("click", calculateTotal);

        $("#resetBtn").on("click", function () {
          const defaultQuantities = [20, 5, 0, 0, 0];
          $(".quantity-input").each(function (index) {
            $(this).val(defaultQuantities[index]);
          });
          calculateTotal();
        });
      });
    </script>
  </body>
</html>
