<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal Gallery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #fdfdfb;
      }

      .gallery-card {
        border: 2px solid #ebebeb;
        border-radius: 0.75rem;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease,
          border-color 0.2s ease;
        cursor: pointer;
        background-color: #ffffff;
      }

      .gallery-card.highlight {
        border-color: #d4a017;
        box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.15);
        transform: translateY(-6px);
      }

      .gallery-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }

      .gallery-card .card-body {
        padding: 1rem 0.5rem 1.25rem;
      }

      .gallery-card .card-title {
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main class="container py-5">
      <header class="text-center mb-4">
        <h1 class="display-6 fw-bold text-uppercase">Animal Gallery</h1>
        <p class="text-muted mb-0">
          Bộ sưu tập hình ảnh động vật sử dụng Bootstrap Grid và jQuery.
        </p>
      </header>

      <section class="row g-4 justify-content-center">
        <div class="col-10 col-sm-6 col-md-4 col-lg-3">
          <article class="gallery-card text-center h-100">
            <img src="lion.png" alt="Lion" />
            <div class="card-body">
              <h2 class="card-title text-uppercase mb-0">Lion</h2>
            </div>
          </article>
        </div>
        <div class="col-10 col-sm-6 col-md-4 col-lg-3">
          <article class="gallery-card text-center h-100">
            <img src="cat.png" alt="Cat" />
            <div class="card-body">
              <h2 class="card-title text-uppercase mb-0">Cat</h2>
            </div>
          </article>
        </div>
        <div class="col-10 col-sm-6 col-md-4 col-lg-3">
          <article class="gallery-card text-center h-100">
            <img src="bird.png" alt="Bird" />
            <div class="card-body">
              <h2 class="card-title text-uppercase mb-0">Bird</h2>
            </div>
          </article>
        </div>
        <div class="col-10 col-sm-6 col-md-4 col-lg-3">
          <article class="gallery-card text-center h-100">
            <img src="rhino.png" alt="Rhino" />
            <div class="card-body">
              <h2 class="card-title text-uppercase mb-0">Rhino</h2>
            </div>
          </article>
        </div>
        <div class="col-10 col-sm-6 col-md-4 col-lg-3">
          <article class="gallery-card text-center h-100">
            <img src="panda.png" alt="Panda" />
            <div class="card-body">
              <h2 class="card-title text-uppercase mb-0">Panda</h2>
            </div>
          </article>
        </div>
        <div class="col-10 col-sm-6 col-md-4 col-lg-3">
          <article class="gallery-card text-center h-100">
            <img src="goat.png" alt="Goat" />
            <div class="card-body">
              <h2 class="card-title text-uppercase mb-0">Goat</h2>
            </div>
          </article>
        </div>
      </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      $(function () {
        $(".gallery-card").on("mouseenter", function () {
          $(this).addClass("highlight");
        });

        $(".gallery-card").on("mouseleave", function () {
          $(this).removeClass("highlight");
        });
      });
    </script>
  </body>
</html>
