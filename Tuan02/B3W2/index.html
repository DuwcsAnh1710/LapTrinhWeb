<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Sunny Acres</title>
    <link rel="stylesheet" href="farm.css">
    <style>
        body {
            background: #000 url('images/background.jpg') repeat;
            margin: 0;
            padding: 20px;
            color: #00ff00;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            margin: 0 auto;
            padding: 20px;
        }
        .logo {
            margin-bottom: 20px;
        }
        .welcome {
            color: #00ff00;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        .address {
            color: #00ff00;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .enter-link img {
            max-width: 400px;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="images/salogo.jpg" alt="Sunny Acres Logo">
        </div>
        <h1 class="welcome">Welcome to Sunny Acres</h1>
        <div class="address">
            Tammy and Brent Nielsen<br>
            1973 Hwy G<br>
            Council Bluffs, IA 51503
        </div>
        <a href="home.html" class="enter-link">
            <img src="images/siggie.jpg" alt="Enter Sunny Acres">
        </a>
    </div>
    <div class="promo">
        <img src="images/promo.jpg" alt="Promotional photo">
    </div>
</body>
</html>
